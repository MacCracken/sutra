[workspace]
resolver = "2"
members = ["crates/*", "."]

[package]
name = "sutra"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[[bin]]
name = "sutra"
path = "src/main.rs"

[dependencies]
sutra-core = { path = "crates/sutra-core" }
sutra-modules = { path = "crates/sutra-modules" }
sutra-ai = { path = "crates/sutra-ai" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[workspace.package]
version = "2026.3.18"
edition = "2024"
license = "GPL-3.0"
authors = ["AGNOS Contributors"]
repository = "https://github.com/MacCracken/sutra"
description = "Sutra — AI-native infrastructure orchestration for AGNOS"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# SSH
russh = "0.48"
russh-keys = "0.48"

# Markdown
comrak = { version = "0.36", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }

# Async
async-trait = "0.1"

# Misc
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
shlex = "1"
tera = "1"
tempfile = "3"
