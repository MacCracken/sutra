name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.arch }}
    needs: [ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
    - uses: actions/checkout@v4

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        key: release-${{ matrix.arch }}

    - name: Install cross-compilation tools (arm64)
      if: matrix.arch == 'arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
        echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

    - name: Build
      run: cargo build --release --locked --target ${{ matrix.target }}

    - name: Smoke test
      if: matrix.arch == 'amd64'
      run: |
        ./target/${{ matrix.target }}/release/sutra --version
        ./target/${{ matrix.target }}/release/sutra modules
        ./target/${{ matrix.target }}/release/sutra validate playbooks/deploy-tarang.toml

    - name: Package
      run: |
        VERSION="${{ github.ref_name }}"
        ARCHIVE="sutra-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
        mkdir -p dist
        cp target/${{ matrix.target }}/release/sutra dist/
        tar czvf "$ARCHIVE" -C dist sutra
        sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sutra-linux-${{ matrix.arch }}
        path: |
          sutra-*.tar.gz
          sutra-*.tar.gz.sha256

  release:
    name: Create Release
    needs: [ci, build]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - uses: softprops/action-gh-release@v2
      with:
        name: Sutra ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          artifacts/sutra-*.tar.gz
          artifacts/sutra-*.tar.gz.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
