name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  # ── Code quality ─────────────────────────────────────────────────────────

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  clippy:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo install cargo-audit --locked
    - run: cargo audit --ignore RUSTSEC-2023-0071  # rsa timing sidechannel — docs/development/dependency-watch.md

  # ── Unit tests (per-crate, no system deps) ───────────────────────────────

  test-core:
    name: Test sutra-core
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test -p sutra-core --locked

  test-modules:
    name: Test sutra-modules
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test -p sutra-modules --locked

  test-mcp:
    name: Test sutra-mcp
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test -p sutra-mcp --locked

  test-ai:
    name: Test sutra-ai
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test -p sutra-ai --locked

  test-transport:
    name: Test sutra-transport
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test -p sutra-transport --locked

  # ── Integration tests (end-to-end playbook execution) ────────────────────

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-core, test-modules]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo test --test integration --locked

  # ── Package build ────────────────────────────────────────────────────────

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test-integration]
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - run: cargo build --release --locked
    - name: Smoke test
      run: |
        ./target/release/sutra --version
        ./target/release/sutra modules
        ./target/release/sutra validate playbooks/deploy-tarang.toml
